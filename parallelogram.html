<body>
<nav class="nav">
  <div class="brand">
    <span class="dot"></span>
    <h1>例题2 · 判定四边形的形状</h1>
    <span class="sub">坐标法 · 由边判形</span>
  </div>
  <div class="nav-actions">
    <button class="btn" id="btnReset">重置</button>
    <button class="btn" id="btnRandom">随机实验</button>
    <button class="btn" id="btnFull">全屏</button>
    <button class="btn" id="btnAbout">关于</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" data-panel="sidebar">
    <div class="card">
      <h2>学习目标</h2>
      <ul class="goals">
        <li><label><input type="checkbox"> 能由四边形四个顶点的坐标求各边斜率</label></li>
        <li><label><input type="checkbox"> 会用两组对边斜率相等判定平行四边形</label></li>
        <li><label><input type="checkbox"> 体会"先描点、再猜形、后验证"的推理顺序</label></li>
        <li><label><input type="checkbox"> 理解由数量关系确定图形形状的坐标法思想</label></li>
      </ul>
    </div>
    <div class="card">
      <h2>核心概念</h2>
      <div style="font-size:13.5px;line-height:2;color:var(--text-secondary)">
        <span class="eq">AB ∥ DC ⇔ k<sub>AB</sub> = k<sub>DC</sub></span><br>
        <span class="eq">BC ∥ AD ⇔ k<sub>BC</sub> = k<sub>AD</sub></span>
      </div>
    </div>
    <div class="card">
      <h2>方法原理</h2>
      <p>只看图形容易看走眼，算出斜率才能作数。用两点坐标公式
        <span class="eq">k = <span class="frac"><span class="fn">y<sub>2</sub> − y<sub>1</sub></span><span class="fd">x<sub>2</sub> − x<sub>1</sub></span></span></span>
        分别算出四条边所在直线的斜率，若两组对边斜率分别相等，就能判定它是平行四边形。</p>
    </div>
    <div class="card">
      <h2>为什么重要</h2>
      <p>工程放样、机械制图、地图测绘中判断地块与构件是否为平行四边形，靠的就是边与边的方向是否一致。把"看起来平行"变成"算出来相等"，是解析几何最实用的一步。</p>
    </div>
  </aside>

  <main class="stage" data-panel="stage">
    <div class="board-box">
      <svg id="board" viewBox="0 0 860 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="平面直角坐标系中的四边形">
        <defs>
          <marker id="axisArrow" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto">
            <path d="M0,0 L9,3.2 L0,6.4 z" fill="#EAB308"></path>
          </marker>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.4" result="b"></feGaussianBlur>
            <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
          </filter>
        </defs>
        <g id="gGrid"></g>
        <g id="gAxes"></g>
        <g id="gSides"></g>
        <g id="gPoints"></g>
      </svg>
      <div class="stepbar" id="stepBar"></div>
    </div>

    <div class="ctrl" data-panel="ctrl">
      <div class="narr" id="narr"></div>
      <div class="ctrl-row">
        <button class="btn primary" id="btnNext">下一步</button>
        <button class="btn" id="btnPrev">上一步</button>
      </div>
      <div class="ctrl-row slider-row">
        <label for="kSlider">上下拖动改变顶点 D 的纵坐标</label>
        <input type="range" id="kSlider" min="-3" max="5" step="1" value="3">
        <span class="val" id="sliderVal">y_D = 3</span>
      </div>
      <div class="result" id="resultBox"></div>
    </div>
  </main>
</div>

<div class="quiz" id="quizPanel" data-panel="quiz">
  <div class="quiz-head">
    <span>随堂小测</span>
    <button id="quizClose" aria-label="收起小测">✕</button>
  </div>
  <div class="quiz-body" id="quizBody"></div>
</div>
<button class="quiz-fab" id="quizFab" aria-label="打开小测">?</button>
<div id="toast" role="status"></div>

<script>
window.__errs = [];
window.addEventListener('error', function(e){ window.__errs.push(String(e.message || e)); });
window.addEventListener('unhandledrejection', function(e){ window.__errs.push('rej:' + String(e.reason)); });

var NS = 'http://www.w3.org/2000/svg';
var OX = 250, OY = 430, U = 80;
var XMIN = -1, XMAX = 5.5, YMIN = -2.5, YMAX = 4.5;

function sx(x){ return OX + x * U; }
function sy(y){ return OY - y * U; }
function mk(tag, attrs){
  var e = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) { if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]); }
  return e;
}
function clearNode(n){ while (n.firstChild) n.removeChild(n.firstChild); }
function gcd(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
function frac(num, den){
  if (den === 0) return '不存在';
  if (den < 0) { num = -num; den = -den; }
  var g = gcd(num, den) || 1;
  num = num / g; den = den / g;
  return den === 1 ? String(num) : (num + '/' + den);
}
function fracHTML(n, d){
  return '<span class="frac"><span class="fn">' + n + '</span><span class="fd">' + d + '</span></span>';
}

/* ---------- 状态 ---------- */
var state = {
  step: 0,
  guess: null,
  animT: 0,
  A: { x: 0, y: 0 },
  B: { x: 2, y: -1 },
  C: { x: 4, y: 2 },
  D: { x: 2, y: 3 }
};
var EXAMPLE = JSON.parse(JSON.stringify({ A: state.A, B: state.B, C: state.C, D: state.D }));

var STEP_NAMES = ['描点', '连成四边形', '观察猜想', '计算各边斜率', '完成证明'];

/* ---------- 静态图层 ---------- */
function buildGrid(){
  var g = document.getElementById('gGrid');
  clearNode(g);
  for (var x = Math.ceil(XMIN); x <= Math.floor(XMAX); x++){
    if (x === 0) continue;
    g.appendChild(mk('line', { x1: sx(x), y1: sy(YMIN), x2: sx(x), y2: sy(YMAX), stroke: 'rgba(255,255,255,0.055)', 'stroke-width': 1 }));
  }
  for (var y = Math.ceil(YMIN); y <= Math.floor(YMAX); y++){
    if (y === 0) continue;
    g.appendChild(mk('line', { x1: sx(XMIN), y1: sy(y), x2: sx(XMAX), y2: sy(y), stroke: 'rgba(255,255,255,0.055)', 'stroke-width': 1 }));
  }
}
function buildAxes(){
  var g = document.getElementById('gAxes');
  clearNode(g);
  g.appendChild(mk('line', { x1: sx(XMIN), y1: sy(0), x2: sx(XMAX + 0.4), y2: sy(0), stroke: '#EAB308', 'stroke-width': 2, 'marker-end': 'url(#axisArrow)' }));
  g.appendChild(mk('line', { x1: sx(0), y1: sy(YMIN), x2: sx(0), y2: sy(YMAX + 0.4), stroke: '#EAB308', 'stroke-width': 2, 'marker-end': 'url(#axisArrow)' }));
  var tx = mk('text', { x: sx(XMAX + 0.4), y: sy(0) + 24, fill: '#EAB308', 'font-size': 15, 'text-anchor': 'middle' });
  tx.textContent = 'x'; g.appendChild(tx);
  var ty = mk('text', { x: sx(0) - 20, y: sy(YMAX + 0.5), fill: '#EAB308', 'font-size': 15, 'text-anchor': 'middle' });
  ty.textContent = 'y'; g.appendChild(ty);
  var to = mk('text', { x: sx(0) - 16, y: sy(0) + 20, fill: '#94A3B8', 'font-size': 13 });
  to.textContent = 'O'; g.appendChild(to);
  for (var x = Math.ceil(XMIN); x <= Math.floor(XMAX); x++){
    if (x === 0) continue;
    var t = mk('text', { x: sx(x), y: sy(0) + 19, fill: '#94A3B8', 'font-size': 12, 'text-anchor': 'middle' });
    t.textContent = String(x); g.appendChild(t);
  }
  for (var y = Math.ceil(YMIN); y <= Math.floor(YMAX); y++){
    if (y === 0) continue;
    var t2 = mk('text', { x: sx(0) - 12, y: sy(y) + 4, fill: '#94A3B8', 'font-size': 12, 'text-anchor': 'end' });
    t2.textContent = String(y); g.appendChild(t2);
  }
}

/* ---------- 斜率与判定 ---------- */
function slopeOf(p1, p2){
  if (p2.x - p1.x === 0) return null;
  return { num: p2.y - p1.y, den: p2.x - p1.x };
}
function sameSlope(s1, s2){
  if (!s1 || !s2) return false;
  return s1.num * s2.den === s2.num * s1.den;
}

/* ---------- 绘制 ---------- */
function drawPoints(){
  var g = document.getElementById('gPoints');
  clearNode(g);
  if (state.step < 1) return;
  var names = ['A', 'B', 'C', 'D'];
  for (var i = 0; i < names.length; i++){
    var n = names[i], p = state[n];
    g.appendChild(mk('circle', { cx: sx(p.x), cy: sy(p.y), r: 7.5, fill: '#FBBF24', stroke: '#0B1220', 'stroke-width': 2.5, filter: 'url(#glow)' }));
    var dx = p.x > 4 ? -14 : 13;
    var t = mk('text', {
      x: sx(p.x) + dx, y: sy(p.y) - 13, fill: '#FDE68A', 'font-size': 16, 'font-weight': 700,
      'text-anchor': p.x > 4 ? 'end' : 'start'
    });
    t.textContent = n + '(' + p.x + ',' + p.y + ')';
    g.appendChild(t);
  }
}

function drawSides(){
  var g = document.getElementById('gSides');
  clearNode(g);
  if (state.step < 2) return;
  var t = Math.max(0.0001, state.animT);
  var segs = [
    { p1: state.A, p2: state.B, color: '#FBBF24', label: 'AB' },
    { p1: state.B, p2: state.C, color: '#22D3EE', label: 'BC' },
    { p1: state.C, p2: state.D, color: '#FBBF24', label: 'CD' },
    { p1: state.D, p2: state.A, color: '#22D3EE', label: 'DA' }
  ];
  for (var i = 0; i < segs.length; i++){
    var s = segs[i];
    var x1 = s.p1.x + (s.p2.x - s.p1.x) * t;
    var y1 = s.p1.y + (s.p2.y - s.p1.y) * t;
    g.appendChild(mk('line', {
      x1: sx(s.p1.x), y1: sy(s.p1.y), x2: sx(x1), y2: sy(y1),
      stroke: s.color, 'stroke-width': 3.4, 'stroke-linecap': 'round',
      filter: 'url(#glow)', opacity: 0.95, 'data-side': s.label
    }));
    if (t > 0.98){
      var mx = (s.p1.x + s.p2.x) / 2, my = (s.p1.y + s.p2.y) / 2;
      var lt = mk('text', {
        x: sx(mx) + 12, y: sy(my) - 8, fill: s.color, 'font-size': 15, 'font-weight': 700
      });
      lt.textContent = s.label;
      g.appendChild(lt);
    }
  }
}

/* ---------- 讲解与结论 ---------- */
function narrHTML(){
  var A = state.A, B = state.B, C = state.C, D = state.D;
  var sAB = slopeOf(A, B), sBC = slopeOf(B, C), sCD = slopeOf(C, D), sDA = slopeOf(D, A);
  var kAB = sAB ? frac(sAB.num, sAB.den) : '不存在';
  var kBC = sBC ? frac(sBC.num, sBC.den) : '不存在';
  var kCD = sCD ? frac(sCD.num, sCD.den) : '不存在';
  var kDA = sDA ? frac(sDA.num, sDA.den) : '不存在';
  if (state.step === 0){
    return '题目给出四边形 <b>ABCD</b> 的四个顶点：<b>A(' + A.x + ',' + A.y + ')</b>、<b>B(' + B.x + ',' + B.y + ')</b>、<b>C(' + C.x + ',' + C.y + ')</b>、<b>D(' + D.x + ',' + D.y + ')</b>。<br>先在坐标系中把它们依次标出来。';
  }
  if (state.step === 1){
    return '四个顶点已经就位。顺次连接 A→B→C→D→A，就得到四边形 ABCD。';
  }
  if (state.step === 2){
    return '观察这个四边形，你觉得它最可能是什么形状？先大胆猜一猜，再用计算来验证。';
  }
  if (state.step === 3){
    var tail = state.guess === null ? '请先作出你的判断。' :
      (state.guess === 'parallelogram'
        ? '你选择的是「平行四边形」。猜想合理，但还要算出斜率才能算数。'
        : '你选择的是「一般四边形」。再仔细看看对边的倾斜方向，也许它们恰好一致。');
    return '用两点坐标公式分别计算四条边所在直线的斜率：<br>' +
      '<span class="eq">k<sub>AB</sub> = ' + fracHTML(B.y + ' − ' + A.y, B.x + ' − ' + A.x) + ' = ' + kAB + '</span>　，　' +
      '<span class="eq">k<sub>DC</sub> = ' + fracHTML(C.y + ' − ' + D.y, C.x + ' − ' + D.x) + ' = ' + kCD + '</span><br>' +
      '<span class="eq">k<sub>BC</sub> = ' + fracHTML(C.y + ' − ' + B.y, C.x + ' − ' + B.x) + ' = ' + kBC + '</span>　，　' +
      '<span class="eq">k<sub>AD</sub> = ' + fracHTML(D.y + ' − ' + A.y, D.x + ' − ' + A.x) + ' = ' + kDA + '</span><br>' + tail;
  }
  var p1 = sameSlope(sAB, sCD), p2 = sameSlope(sBC, sDA);
  var concl = (p1 && p2) ? '平行四边形' : (p1 || p2 ? '梯形' : '一般四边形');
  return '因为 <span class="eq">k<sub>AB</sub> = k<sub>DC</sub> = ' + kAB + '</span>，所以 <b>AB ∥ DC</b>；' +
    '又因为 <span class="eq">k<sub>BC</sub> = k<sub>AD</sub> = ' + kBC + '</span>，所以 <b>BC ∥ AD</b>。<br>' +
    '两组对边分别平行，因此四边形 ABCD 是 <b>' + concl + '</b>。';
}

function renderNarr(){
  var box = document.getElementById('narr');
  box.innerHTML = narrHTML();
  if (state.step === 2){
    var row = document.createElement('div');
    row.className = 'guess-row';
    var b1 = document.createElement('button');
    b1.className = 'btn' + (state.guess === 'parallelogram' ? ' primary' : '');
    b1.textContent = '我猜是平行四边形';
    b1.onclick = function(){ state.guess = 'parallelogram'; renderNarr(); toast('已记录你的猜想：平行四边形'); };
    var b2 = document.createElement('button');
    b2.className = 'btn' + (state.guess === 'general' ? ' primary' : '');
    b2.textContent = '我猜是一般四边形';
    b2.onclick = function(){ state.guess = 'general'; renderNarr(); toast('已记录你的猜想：一般四边形'); };
    row.appendChild(b1); row.appendChild(b2);
    box.appendChild(row);
  }
}

function renderResult(){
  var box = document.getElementById('resultBox');
  var sAB = slopeOf(state.A, state.B), sCD = slopeOf(state.C, state.D);
  var sBC = slopeOf(state.B, state.C), sDA = slopeOf(state.D, state.A);
  var kAB = sAB ? frac(sAB.num, sAB.den) : '不存在';
  var kBC = sBC ? frac(sBC.num, sBC.den) : '不存在';
  var kCD = sCD ? frac(sCD.num, sCD.den) : '不存在';
  var kDA = sDA ? frac(sDA.num, sDA.den) : '不存在';
  var p1 = sameSlope(sAB, sCD), p2 = sameSlope(sBC, sDA);
  var shape = (p1 && p2) ? '平行四边形' : (p1 || p2 ? '梯形' : '一般四边形');
  var cells = [
    { lbl: 'AB 与 DC 的斜率', v: kAB + ' , ' + kCD, hit: p1 },
    { lbl: 'BC 与 AD 的斜率', v: kBC + ' , ' + kDA, hit: p2 },
    { lbl: '四边形 ABCD 的形状', v: shape, hit: (p1 && p2) }
  ];
  box.innerHTML = '';
  for (var i = 0; i < cells.length; i++){
    var d = document.createElement('div');
    d.className = 'res-cell' + (cells[i].hit ? ' hit' : '');
    var l = document.createElement('span'); l.className = 'lbl'; l.textContent = cells[i].lbl;
    var v = document.createElement('span'); v.className = 'v'; v.textContent = cells[i].v;
    d.appendChild(l); d.appendChild(v);
    box.appendChild(d);
  }
}

function renderSteps(){
  var bar = document.getElementById('stepBar');
  bar.innerHTML = '';
  for (var i = 0; i < STEP_NAMES.length; i++){
    var c = document.createElement('span');
    var cls = 'chip';
    if (i + 1 === state.step) cls += ' active';
    else if (i + 1 < state.step) cls += ' done';
    c.className = cls;
    c.textContent = (i + 1) + ' · ' + STEP_NAMES[i];
    bar.appendChild(c);
  }
  document.getElementById('btnNext').disabled = state.step >= 5;
  document.getElementById('btnPrev').disabled = state.step <= 0;
}

function render(){
  drawSides();
  renderResult();
}

function fullRender(){
  drawPoints();
  drawSides();
  renderSteps();
  renderNarr();
  renderResult();
  document.getElementById('sliderVal').textContent = 'y_D = ' + state.D.y;
  document.getElementById('kSlider').value = String(state.D.y);
}

/* ---------- 交互 ---------- */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

function setStep(n){
  var prev = state.step;
  state.step = Math.max(0, Math.min(5, n));
  if (state.step >= 2 && prev < 2) state.animT = 0;
  if (state.step < 2) state.animT = 0;
  fullRender();
}

function resetAll(){
  state.step = 0;
  state.guess = null;
  state.animT = 0;
  state.A = JSON.parse(JSON.stringify(EXAMPLE.A));
  state.B = JSON.parse(JSON.stringify(EXAMPLE.B));
  state.C = JSON.parse(JSON.stringify(EXAMPLE.C));
  state.D = JSON.parse(JSON.stringify(EXAMPLE.D));
  fullRender();
  toast('已回到初始状态');
}

function randInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

function randomize(){
  for (var attempt = 0; attempt < 400; attempt++){
    var bx = randInt(1, 2), by = randInt(-2, 1);
    var dxv = randInt(2, 3), dyv = randInt(1, 3);
    if (Math.random() < 0.5) dyv = -dyv;
    var ax = 0, ay = 0;
    var cx = ax + dxv, cy = ay + dyv;
    var nA = { x: ax, y: ay };
    var nB = { x: ax + bx, y: ay + by };
    var nD = { x: ax + dxv, y: ay + dyv };
    var nC = { x: nB.x + dxv, y: nB.y + dyv };
    if (nC.x > 5 || nC.y > 4 || nC.y < -2) continue;
    var s1 = { num: nB.y - nA.y, den: nB.x - nA.x };
    var s2 = { num: nC.y - nD.y, den: nC.x - nD.x };
    if (!sameSlope(s1, s2)) continue;
    state.A = nA; state.B = nB; state.C = nC; state.D = nD;
    state.step = 0; state.guess = null; state.animT = 0;
    fullRender();
    toast('新数据已就绪：这仍是一个平行四边形');
    return;
  }
  toast('本次随机未取到合适数据，请再试一次');
}

/* ---------- 小测 ---------- */
var QUIZ = [
  {
    q: '已知四边形 ABCD 的顶点 A(0,0)、B(2,−1)、C(4,2)、D(2,3)，则四边形 ABCD 是（　）',
    opts: ['平行四边形', '梯形', '矩形', '一般四边形'],
    ans: 0,
    why: 'k_AB = k_DC = −1/2，k_BC = k_AD = 3/2，两组对边分别平行，所以是平行四边形。'
  },
  {
    q: '用坐标法判断四边形形状的一般顺序是（　）',
    opts: ['直接套公式算斜率', '先描点观察，再求斜率验证', '先量角度，再算边长', '随意计算，看出结论即可'],
    ans: 1,
    why: '先由图形观察提出猜想，再用斜率计算加以验证，这是坐标法解决几何问题的基本顺序。'
  },
  {
    q: '若四边形的两组对边所在直线的斜率分别相等，则该四边形一定是（　）',
    opts: ['正方形', '矩形', '平行四边形', '菱形'],
    ans: 2,
    why: '两组对边分别平行只能判定平行四边形；是否为矩形或菱形还需进一步考察邻边是否垂直或相等。'
  }
];

function buildQuiz(){
  var body = document.getElementById('quizBody');
  body.innerHTML = '';
  for (var i = 0; i < QUIZ.length; i++){
    (function(idx){
      var item = QUIZ[idx];
      var wrap = document.createElement('div');
      wrap.className = 'q-item';
      var q = document.createElement('div');
      q.className = 'q';
      q.textContent = (idx + 1) + '. ' + item.q;
      wrap.appendChild(q);
      var why = document.createElement('div');
      why.className = 'why';
      why.textContent = item.why;
      for (var j = 0; j < item.opts.length; j++){
        (function(oi){
          var b = document.createElement('button');
          b.className = 'opt';
          b.type = 'button';
          b.textContent = String.fromCharCode(65 + oi) + '. ' + item.opts[oi];
          b.onclick = function(){
            if (wrap.dataset.done === '1') return;
            wrap.dataset.done = '1';
            var kids = wrap.querySelectorAll('.opt');
            for (var m = 0; m < kids.length; m++) kids[m].disabled = true;
            if (oi === item.ans){
              b.classList.add('right');
              toast('回答正确');
            } else {
              b.classList.add('wrong');
              kids[item.ans].classList.add('right');
              toast('再想一想，看看解析');
            }
            why.classList.add('show');
          };
          wrap.appendChild(b);
        })(j);
      }
      wrap.appendChild(why);
      body.appendChild(wrap);
    })(i);
  }
}

/* ---------- 事件绑定 ---------- */
document.getElementById('btnNext').onclick = function(){ setStep(state.step + 1); };
document.getElementById('btnPrev').onclick = function(){ setStep(state.step - 1); };
document.getElementById('btnReset').onclick = function(){ resetAll(); };
document.getElementById('btnRandom').onclick = function(){ randomize(); };
document.getElementById('btnFull').onclick = function(){
  var el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
  else if (document.exitFullscreen) document.exitFullscreen();
};
document.getElementById('btnAbout').onclick = function(){
  toast('拖动滑块改变顶点 D 的纵坐标，观察两组对边斜率何时分别相等');
};
document.getElementById('kSlider').oninput = function(){
  state.D.y = parseInt(this.value, 10);
  if (state.step < 2) state.step = 2;
  if (state.step >= 2 && state.animT < 1) state.animT = 1;
  fullRender();
};
document.getElementById('quizClose').onclick = function(){
  document.getElementById('quizPanel').classList.add('hidden');
  document.getElementById('quizFab').classList.add('show');
};
document.getElementById('quizFab').onclick = function(){
  document.getElementById('quizPanel').classList.remove('hidden');
  document.getElementById('quizFab').classList.remove('show');
};

/* ---------- 启动 ---------- */
buildGrid();
buildAxes();
buildQuiz();
fullRender();

var __tick = 0;
var __last = performance.now();
function loop(now){
  __tick++;
  try {
    var dt = Math.min(60, now - __last);
    __last = now;
    if (state.step >= 2 && state.animT < 1){
      state.animT = Math.min(1, state.animT + dt / 650);
      drawSides();
    }
  } catch (e) {
    console.error('[loop]', e);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 自检探针 ---------- */
setTimeout(function(){
  var t0 = __tick;
  setTimeout(function(){
    console.assert(__tick > t0, '[FATAL] 动画循环已停止');
    var svg = document.getElementById('board');
    console.assert(svg && svg.querySelectorAll('line').length >= 8, '[FATAL] 坐标系图元缺失');
    var vp = document.querySelector('meta[name="viewport"]');
    console.assert(vp && /width=\d{3,}/.test(vp.getAttribute('content') || ''), '[FATAL] 缺少设计宽度声明');
    var panels = document.querySelectorAll('[data-panel]');
    var rects = [];
    for (var i = 0; i < panels.length; i++) rects.push(panels[i].getBoundingClientRect());
    for (var a = 0; a < rects.length; a++){
      for (var b = a + 1; b < rects.length; b++){
        var r1 = rects[a], r2 = rects[b];
        var ov = !(r1.right <= r2.left || r2.right <= r1.left || r1.bottom <= r2.top || r2.bottom <= r1.top);
        if (ov) console.warn('面板重叠', panels[a], panels[b]);
      }
      if (rects[a].height < 20) console.warn('面板塌陷', panels[a]);
    }
    console.assert(!(window.__errs || []).length, '[FATAL] 存在未处理异常', window.__errs);
  }, 600);
}, 900);
</script>
